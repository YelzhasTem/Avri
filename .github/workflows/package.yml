name: Package

# Builds installers for macOS, Windows and Linux. Called by CI and Release.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: mac
          - name: Windows
            os: windows-latest
            platform: win
          - name: Linux
            os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Spotlight indexing keeps freshly built disk images busy, which makes
      # hdiutil fail to detach them on hosted macOS runners.
      - name: Turn off Spotlight indexing
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      - name: Build installer
        run: node scripts/dist.mjs ${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check that no .env file is packaged
        shell: bash
        run: |
          found=0
          while IFS= read -r archive; do
            if npx --yes @electron/asar@3 list "$archive" | grep -Ei '(^|[/\\])\.env'; then
              echo "::error::A .env file was packaged into $archive"
              found=1
            fi
          done < <(find release -name app.asar)
          if [ -z "$(find release -name app.asar -print -quit)" ]; then
            echo "::error::app.asar not found"
            exit 1
          fi
          [ "$found" = 0 ] && echo "No .env file in any packaged app"
          exit "$found"

      - uses: actions/upload-artifact@v4
        with:
          name: Avri-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
          retention-days: 14
