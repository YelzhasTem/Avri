<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Avri</title>
  <desc id="d">Desktop AI companion built with Electron, React and Gemini that remembers only what you approve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17181B"/>
      <stop offset="1" stop-color="#202126"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <circle cx="990" cy="190" r="230" fill="#7C8CFF" opacity="0.22" filter="url(#blur)"/>
    <circle cx="260" cy="440" r="170" fill="#7C8CFF" opacity="0.08" filter="url(#blur)"/>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="72" y="106" fill="#7C8CFF" font-size="15" font-weight="700" letter-spacing="3">DESKTOP AI COMPANION</text>
      <text x="66" y="200" fill="#F3F3F4" font-size="108" font-weight="800" letter-spacing="-3">Avri</text>
      <text x="72" y="244" fill="#A3A4A9" font-size="23">Chat with Gemini on your desktop.</text>
      <text x="72" y="274" fill="#A3A4A9" font-size="23">It remembers only what you approve.</text>

      <g font-size="15" font-weight="600" text-anchor="middle" fill="#D5D6DA">
        <rect x="72" y="302" width="108" height="36" rx="18" fill="#26272B" stroke="#34363C"/>
        <text x="126" y="325">Electron</text>
        <rect x="190" y="302" width="186" height="36" rx="18" fill="#26272B" stroke="#34363C"/>
        <text x="283" y="325">React + TypeScript</text>
        <rect x="386" y="302" width="150" height="36" rx="18" fill="#26272B" stroke="#34363C"/>
        <text x="461" y="325">Google Gemini</text>
      </g>

      <!-- App window -->
      <g transform="translate(744 46)" filter="url(#shadow)">
        <rect width="480" height="308" rx="16" fill="#1D1E21" stroke="#303237"/>
        <path d="M1 38 H120 V291 Q120 307 104 307 H17 Q1 307 1 291 Z" fill="#191A1D"/>
        <rect x="1" y="38" width="478" height="1" fill="#2A2C30"/>
        <rect x="120" y="38" width="1" height="269" fill="#2A2C30"/>
        <circle cx="20" cy="19" r="5.5" fill="#FF5F57"/>
        <circle cx="38" cy="19" r="5.5" fill="#FEBC2E"/>
        <circle cx="56" cy="19" r="5.5" fill="#28C840"/>
        <text x="240" y="24" fill="#777980" font-size="12" font-weight="600" text-anchor="middle">Avri</text>

        <!-- Sidebar -->
        <rect x="12" y="52" width="96" height="28" rx="8" fill="#7C8CFF" fill-opacity="0.14"/>
        <text x="24" y="70.5" fill="#C8CEFF" font-size="11.5" font-weight="600">+ New chat</text>
        <rect x="14" y="98" width="80" height="8" rx="4" fill="#2A2C30"/>
        <rect x="14" y="122" width="64" height="8" rx="4" fill="#2A2C30"/>
        <rect x="14" y="146" width="74" height="8" rx="4" fill="#2A2C30"/>
        <rect x="14" y="170" width="56" height="8" rx="4" fill="#2A2C30"/>
        <text x="16" y="282" fill="#A3A4A9" font-size="11.5" font-weight="600">Library</text>

        <!-- Conversation -->
        <rect x="236" y="56" width="216" height="50" rx="14" fill="#2B2E45"/>
        <text x="252" y="77" fill="#F3F3F4" font-size="13">Plan my study week.</text>
        <text x="252" y="96" fill="#F3F3F4" font-size="13">I prefer mornings.</text>

        <circle cx="150" cy="132" r="11" fill="#7C8CFF" fill-opacity="0.22"/>
        <path transform="translate(150 132)" d="M0 -6 C0.8 -1.8 1.8 -0.8 6 0 C1.8 0.8 0.8 1.8 0 6 C-0.8 1.8 -1.8 0.8 -6 0 C-1.8 -0.8 -0.8 -1.8 0 -6 Z" fill="#7C8CFF"/>
        <rect x="172" y="124" width="250" height="8" rx="4" fill="#303237"/>
        <rect x="172" y="140" width="276" height="8" rx="4" fill="#303237"/>
        <rect x="172" y="156" width="196" height="8" rx="4" fill="#303237"/>

        <!-- Memory proposal -->
        <rect x="148" y="184" width="300" height="104" rx="14" fill="#7C8CFF" fill-opacity="0.08" stroke="#7C8CFF" stroke-opacity="0.45"/>
        <circle cx="172" cy="207" r="12" fill="#7C8CFF" fill-opacity="0.2"/>
        <path transform="translate(172 207)" d="M0 -7 C1 -2 2 -1 7 0 C2 1 1 2 0 7 C-1 2 -2 1 -7 0 C-2 -1 -1 -2 0 -7 Z" fill="#7C8CFF"/>
        <text x="192" y="212" fill="#F3F3F4" font-size="13" font-weight="700">Save to memory?</text>
        <text x="164" y="239" fill="#A3A4A9" font-size="13">Prefers studying in the mornings</text>
        <rect x="164" y="252" width="62" height="24" rx="7" fill="#7C8CFF"/>
        <text x="195" y="268" fill="#191A1D" font-size="12" font-weight="700" text-anchor="middle">Save</text>
        <rect x="234" y="252" width="74" height="24" rx="7" fill="none" stroke="#3A3C42"/>
        <text x="271" y="268" fill="#A3A4A9" font-size="12" font-weight="600" text-anchor="middle">Dismiss</text>
      </g>
    </g>
  </g>
</svg>
